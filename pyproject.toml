[project]
name = "environments-api"
version = "0.1.0"
description = "Sandboxed environments and shells, as an API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "keyring-client",
    "settings-client",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

# Published as tagged git sources. A new client release is a new tag and a version bump here.
[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
settings-client = { git = "https://github.com/tochi-mba/Settings-api", subdirectory = "clients/python", tag = "settings-client-v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.11"
# The service only runs on Linux: the sandbox tiers need unshare, setpriv, useradd and
# /proc. Checking against the Linux stdlib stubs makes `make check` give the same answer
# on a Windows or macOS workstation as it does in CI, instead of 76 errors about
# os.killpg and resource.getrlimit that no deployment will ever see.
platform = "linux"
warn_unreachable = true
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true
# Forked test children that dropped privileges must still be able to write their data.
data_file = ".coverage-data/.coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "if __name__ == \"__main__\":",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The sandbox knows nothing about HTTP"
type = "forbidden"
source_modules = ["app.sandbox", "app.shells", "app.processes", "app.procfs", "app.files"]
forbidden_modules = ["app.api", "app.main", "fastapi"]
# What isolates a process must be testable, and reviewable, without an HTTP request in
# sight. A sandbox module that reached for a request object would be one whose rules could
# change with the shape of a route.
#
# Direct imports only: the sandbox raises the domain errors in app.errors, and that module
# also holds the handlers that render them, so it imports FastAPI. Splitting the errors
# from their rendering would let this contract be exhaustive, and is worth doing.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Keyring is spoken to from one package"
type = "forbidden"
source_modules = [
    "app.api",
    "app.environments",
    "app.sandbox",
    "app.shells",
    "app.processes",
    "app.files",
    "app.audit",
    "app.middleware",
]
forbidden_modules = ["keyring_client", "jwt"]
# app.keyring is the one package that talks to keyring, and app.settings validates the
# service token with keyring's own rule rather than a copy of it that could drift.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Settings-api is spoken to from one module"
type = "forbidden"
source_modules = [
    "app.api",
    "app.environments",
    "app.keyring",
    "app.sandbox",
    "app.shells",
    "app.processes",
    "app.files",
    "app.audit",
    "app.middleware",
]
forbidden_modules = ["settings_client"]
# app.preferences is the one module that reads settings-api. A second reader has to be
# added here on purpose.
allow_indirect_imports = true
